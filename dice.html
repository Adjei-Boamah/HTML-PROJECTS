<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1{
            
            color: goldenrod;
            text-shadow: 2px 2px white;
            font-weight: bold;
        }
        button{
            padding: 15px;
            margin:10px;
            color:green;
            background-color: goldenrod;
            border-radius: 10px;

        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: green;
            text-align: center;
            color: white;

        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Dice</title>
</head>
<body>
    <h1>WELCOME TO ROLL DICE </h1>
    <button id="roll-el" onclick="Roll()">Roll Dice</button>
    <button onclick="Reset()">Reset Score</button>
    <p id="score-elem">0</p>
    <p id="black-el"></p>
    <script>
        let Score = document.getElementById("score-elem");
        let Black = document.getElementById("black-el");

        let core = 0;
        function Roll(){
            let RandonNum = Math.floor( Math.random() * 6) + 1;
            core += RandonNum;
           Score.textContent = `you rolled a ${RandonNum}🎲  Total Score: ${core}`;

           if(core === 11){
            Black.textContent = "You hit BlackJack with this score"
           }else{
            Black.textContent = 'Keep trying '
           }
        }
        function Reset(){
            core = 0;
           Score.innerHTML = ` total Score: ${core}`;
           Black.textContent = ' '
        }
        
        
    </script>
</body>
</html>
